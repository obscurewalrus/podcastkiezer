name: Daily poll

on:
  schedule:
    # 14:00 UTC = 15:00 winter / 16:00 zomer (NL).
    # Cron in GitHub Actions is altijd UTC en kent geen DST.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate poll
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: python poll.py

      - name: Commit log
        run: |
          git config user.name "podcastkiezer-bot"
          git config user.email "podcastkiezer-bot@users.noreply.github.com"
          git add out/
          if git diff --staged --quiet; then
            echo "Geen nieuwe logregel om te committen."
          else
            git commit -m "Daily poll $(date -u +%Y-%m-%d)"
            git push
          fi
