name: Daily poll

on:
  schedule:
    # 14:00 UTC = 15:00 winter / 16:00 zomer (NL).
    # Cron in GitHub Actions is altijd UTC en kent geen DST.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Een floating @latest pin maakt de workflow afhankelijk van een toekomstige
# wrangler-release zonder code-wijziging in deze repo. Bump bewust.
env:
  WRANGLER_VERSION: "4"

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate poll
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: python poll.py

      - name: Setup Node (for Wrangler)
        if: env.HAS_CF == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Push poll to Cloudflare D1
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        # Draai vanuit een lege map zodat wrangler de wrangler.toml van de
        # repo (die alleen Pages-config bevat) niet probeert te valideren.
        run: |
          today=$(TZ=Europe/Amsterdam date +%F)
          sql_abs="$(pwd)/out/${today}.sql"
          if [ ! -f "$sql_abs" ]; then
            echo "Geen SQL-bestand voor $today — sla D1-push over."
            exit 0
          fi
          db_name="${D1_DATABASE_NAME:-podcastkiezer-db}"
          tmp_cwd="$(mktemp -d)"
          cd "$tmp_cwd"
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$db_name" --remote --file "$sql_abs"

      - name: Commit log
        # Loop ook bij gefaalde D1-push — anders raken de markdown- en
        # SQL-logs van een succesvol gegenereerde poll alsnog verloren.
        if: always()
        run: |
          git config user.name "podcastkiezer-bot"
          git config user.email "podcastkiezer-bot@users.noreply.github.com"
          git add out/
          if git diff --staged --quiet; then
            echo "Geen nieuwe logregel om te committen."
          else
            git commit -m "Daily poll $(date -u +%Y-%m-%d)"
            git push
          fi
