name: Daily poll

on:
  schedule:
    # GitHub Actions scheduled workflows zijn 'best effort' — vooral rond
    # hele uren worden ze vertraagd door piekbelasting. Daarom:
    #  - offbeat minuten (niet :00 of :30)
    #  - ~15 minuten vóór het gewenste publicatie-tijdstip gepland, om
    #    de gebruikelijke paar-minuten-vertraging te absorberen.
    #
    #  morning   : 06:17 UTC ≈ 08:17 NL zomer (doel 08:30) / 07:17 winter.
    #              72u-venster: NOS/VK nog van gisteren-middag.
    #  afternoon : 15:43 UTC ≈ 17:43 NL zomer (doel 18:00) / 16:43 winter.
    #              24u-venster: alle vier vers van vandaag. Push gaat
    #              alleen voor dit slot uit.
    #
    # Bij ernstige GH-vertraging (>30 min, soms gebeurt) landen polls
    # toch later; daar valt met scheduled GH Actions niets aan te doen.
    - cron: "17 6 * * *"
    - cron: "43 15 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Welk slot: morning, afternoon, of auto (op tijd)."
        default: "auto"

permissions:
  contents: write

# Een floating @latest pin maakt de workflow afhankelijk van een toekomstige
# wrangler-release zonder code-wijziging in deze repo. Bump bewust.
env:
  WRANGLER_VERSION: "4"

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_PUSH: ${{ secrets.PUSH_BROADCAST_URL != '' && secrets.PUSH_BROADCAST_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine slot
        # Cron-trigger → slot uit de schedule; handmatig → input (auto =
        # afleiden uit het NL-uur). Zet SLOT in de job-omgeving.
        run: |
          slot="${{ github.event.inputs.slot }}"
          if [ -z "$slot" ] || [ "$slot" = "auto" ]; then
            case "${{ github.event.schedule }}" in
              "17 6 * * *") slot="morning" ;;
              "43 15 * * *") slot="afternoon" ;;
              *)
                hour=$(TZ=Europe/Amsterdam date +%H)
                if [ "$hour" -lt 12 ]; then slot="morning"; else slot="afternoon"; fi
                ;;
            esac
          fi
          echo "SLOT=$slot" >> "$GITHUB_ENV"
          echo "Slot voor deze run: $slot"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate poll
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: python poll.py --slot "$SLOT"

      - name: Setup Node (for Wrangler)
        if: env.HAS_CF == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Push poll to Cloudflare D1
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        # Draai vanuit een lege map zodat wrangler de wrangler.toml van de
        # repo (die alleen Pages-config bevat) niet probeert te valideren.
        run: |
          today=$(TZ=Europe/Amsterdam date +%F)
          sql_abs="$(pwd)/out/${today}-${SLOT}.sql"
          if [ ! -f "$sql_abs" ]; then
            echo "Geen SQL-bestand voor ${today}-${SLOT} — sla D1-push over."
            exit 0
          fi
          db_name="${D1_DATABASE_NAME:-podcastkiezer-db}"
          tmp_cwd="$(mktemp -d)"
          cd "$tmp_cwd"
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$db_name" --remote --file "$sql_abs"

      - name: Broadcast push notifications
        # Pusht voor beide slots zodat de timing per slot te volgen is.
        if: env.HAS_CF == 'true' && env.HAS_PUSH == 'true'
        env:
          PUSH_BROADCAST_URL: ${{ secrets.PUSH_BROADCAST_URL }}
          PUSH_BROADCAST_SECRET: ${{ secrets.PUSH_BROADCAST_SECRET }}
        # Niet-blocking: een gefaalde broadcast hoeft de logboek-commit
        # niet tegen te houden. De response bevat sent/removed/failed.
        run: |
          set +e
          today=$(TZ=Europe/Amsterdam date +%F)
          if [ ! -f "out/${today}-${SLOT}.sql" ]; then
            echo "Geen verse middag-poll — broadcast overslaan."
            exit 0
          fi
          curl -fsS -X POST "$PUSH_BROADCAST_URL" \
            -H "Authorization: Bearer $PUSH_BROADCAST_SECRET" \
            -H "Content-Length: 0" \
            && echo "" \
            || echo "Push broadcast faalde — niet kritiek."

      - name: Commit log
        # Loop ook bij gefaalde D1-push — anders raken de markdown- en
        # SQL-logs van een succesvol gegenereerde poll alsnog verloren.
        if: always()
        run: |
          git config user.name "podcastkiezer-bot"
          git config user.email "podcastkiezer-bot@users.noreply.github.com"
          git add out/
          if git diff --staged --quiet; then
            echo "Geen nieuwe logregel om te committen."
          else
            git commit -m "Daily poll $(date -u +%Y-%m-%d) ($SLOT)"
            git push
          fi
