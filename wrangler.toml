name = "podcastkiezer"
pages_build_output_dir = "web"
compatibility_date = "2025-05-01"

# D1-binding. Voor Pages koppel je 'm óók via de dashboard
# (Settings → Functions → D1 database bindings) met dezelfde naam "DB";
# de regel hieronder is voor `wrangler d1 execute --file migrations/...`
# en voor lokale `wrangler pages dev`.
[[d1_databases]]
binding = "DB"
database_name = "podcastkiezer-db"
database_id = "4207701a-51aa-4d49-ae9c-b609035afc81"

# Plain environment variables (publiek; geen geheimen).
# Vul VAPID_PUBLIC_KEY in met de waarde uit `node scripts/gen_vapid.js`,
# en zet VAPID_SUBJECT op een echt mailadres dat push-services kunnen
# benaderen bij problemen. Secrets (VAPID_PRIVATE_KEY_JWK en
# PUSH_BROADCAST_SECRET) blijven via de Cloudflare-dashboard.
[vars]
VAPID_PUBLIC_KEY = "BDnK_rf0bPvM8WUM27mSHJDUMTnb9oRJGwS0guNWj1MlenXwVux4yQRx6gLXO4UXCFZaWQR7Fyzhq2YD_vYtxek"
VAPID_SUBJECT = "mailto:l.brouwers@nrc.nl"
